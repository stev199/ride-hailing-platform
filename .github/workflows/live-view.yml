name: Live View

# Opt-in (E5): dispatch-only - never runs on fork PRs. Exposes the Test Viewer through a
# Cloudflare quick tunnel with a per-run random token; auto-teardown at timeout. Tunnels are
# third-party and optional; if unavailable, rely on E6 reports and E3 videos.
#
# Two-job layout: the guard job always runs (fast) and reports; the live-view job is
# SKIPPED until the android module exists (Phase 2). The previous single-job guard used
# `exit 0` inside a step, which only ends the STEP - the job continued and burned
# ~15 min of runner time booting an idle stack.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario (e.g. rider-booking, cross-actor-all)'
        default: 'cross-actor-all'
      slow_motion_ms:
        description: 'Delay injected between storyboard steps'
        default: '800'
      step_mode:
        description: 'Tests wait for Next in the viewer'
        default: 'false'
      keep_alive_minutes:
        description: 'Inspect window after tests (max 30)'
        default: '10'

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if git ls-files | grep -qE '^android/.*/build\.gradle\.kts$'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android module not present yet (Phase 2) - nothing to show live. Use the report gallery."
          fi
      - name: Summary
        if: steps.check.outputs.android != 'true'
        run: |
          {
            echo "## Live View"
            echo "Skipped: the android module does not exist yet (lands in Phase 2)."
            echo "Use the report gallery: https://stev199.github.io/ride-hailing-platform/"
          } >> "$GITHUB_STEP_SUMMARY"

  live-view:
    name: live-view
    needs: guard
    if: needs.guard.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM (D4)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Start stack (test profile, per-run namespace)
        run: |
          make up-test
          ./scripts/wait-for-health.sh
          ./scripts/seed-test.sh live-view-${{ github.run_id }}
      - name: Start Test Viewer (token protected)
        env:
          KEEP: ${{ inputs.keep_alive_minutes }}
        run: |
          TOKEN=$(openssl rand -hex 16)
          # Round-16: NO ::add-mask:: here - masking makes GitHub replace the token
          # with *** in the ::notice annotation AND the step summary, so the
          # "see annotation" pointer handed out an UNUSABLE URL (the token was
          # never readable anywhere). The token only guards an ephemeral tunnel on
          # a private repo for the duration of the run; VISIBILITY_SPEC E5 defines
          # the URL as containing the token.
          echo "VIEWER_TOKEN_VALUE=$TOKEN" >> "$GITHUB_ENV"
          cd tools/test-viewer && npm ci --no-audit --no-fund
          VIEWER_TOKEN="$TOKEN" node server.js > /tmp/viewer.log 2>&1 &
          sleep 2
          curl -fsS "http://localhost:7070/api/state?token=$TOKEN" >/dev/null
          # Round-21: smoke BEFORE the tunnel - reproduces the browser flow (page
          # load with ?token= -> cookie -> in-page fetches). The reported
          # "stuck at loading" shipped because page fetches were unauthenticated;
          # a viewer regression now fails the run instead of a dead page.
          node smoke.js
      - name: Install Android SDK components (emulator is NOT preinstalled on ubuntu-24.04)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Create AVD + boot two emulators (live stream)
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n e2e_api34 -k "system-images;android-34;google_apis;x86_64" -d pixel_5
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          ./scripts/start-emulators.sh 2
      - name: Tunnel (cloudflared quick tunnel, pinned)
        run: |
          # Round-11 root cause (run 45647842910): the pinned download URL was
          # https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64.tgz
          # -> HTTP 404 (tag does not exist, and linux assets ship as a PLAIN BINARY -
          # only darwin gets a .tgz). curl -f then exited 22 and the job died before the
          # tunnel ever started. Pinned to a verified-real tag+asset (2026.11.2, plain
          # binary, asset list checked via the releases API 2026-11-25).
          #
          # Round-21: run 45969240475 hit "tunnel unavailable" - cloudflared ran but
          # never printed the URL (its log stayed on the runner, invisible). Retry
          # once with --protocol http2 (QUIC/UDP 7844 egress is the usual blocker on
          # sandboxed runners) and ALWAYS dump the cloudflared log tail when no URL
          # materialized, so the failure reason is in the GitHub log.
          curl -fsSL -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.11.2/cloudflared-linux-amd64"
          chmod +x /tmp/cloudflared
          start_tunnel() {
            nohup /tmp/cloudflared tunnel --no-autoupdate "$@" --url http://localhost:7070 > /tmp/cloudflared.log 2>&1 &
          }
          grab_url() {
            URL=""
            for _ in $(seq 1 45); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
              [ -n "$URL" ] && break
              sleep 2
            done
            echo "$URL"
          }
          start_tunnel
          URL=$(grab_url)
          if [ -z "$URL" ]; then
            echo "::warning::first tunnel attempt produced no URL - retrying with --protocol http2"
            pkill -f "cloudflared tunnel" || true
            echo "--- cloudflared.log (attempt 1) ---"; tail -20 /tmp/cloudflared.log || true
            start_tunnel --protocol http2
            URL=$(grab_url)
          fi
          if [ -z "$URL" ]; then
            echo "--- cloudflared.log (attempt 2) ---"; tail -20 /tmp/cloudflared.log || true
            echo "::warning::tunnel unavailable - rely on report gallery + videos (E5 fallback)"
            echo "TUNNEL_URL=" >> "$GITHUB_ENV"
          else
            echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
            echo "::notice title=Live View ready::$URL?token=$VIEWER_TOKEN_VALUE"
          fi
      - name: Run scenario (slow motion / step mode)
        env:
          VIEWER_TOKEN: ${{ env.VIEWER_TOKEN_VALUE }}
          STEP_DELAY_MS: ${{ inputs.slow_motion_ms }}
          STEP_MODE: ${{ inputs.step_mode }}
        run: |
          if [ -d e2e ] && [ -f e2e/package.json ]; then
            (cd e2e && npm ci && node orchestrator.js --scenario "${{ inputs.scenario }}")
          else
            echo "::notice::orchestrator actors wire up in Phase 2 - viewer is live but idle."
            sleep 30
          fi
      - name: Keep alive for inspection
        env:
          KEEP: ${{ inputs.keep_alive_minutes }}
        run: |
          MIN=$(( KEEP > 30 ? 30 : KEEP ))
          echo "keeping viewer alive ${MIN}min"; sleep "${MIN}m"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Live View"
            if [ -n "$TUNNEL_URL" ]; then
              # Round-16: full URL in the summary (token was previously masked -> unusable).
              echo "Open: ${TUNNEL_URL}?token=${VIEWER_TOKEN_VALUE}"
              echo "(same URL as the 'Live View ready' annotation; viewer rejects requests without the token)"
            else
              echo "No tunnel this run - see report gallery and videos instead."
            fi
            echo "Scenario: ${{ inputs.scenario }}"
          } >> "$GITHUB_STEP_SUMMARY"
