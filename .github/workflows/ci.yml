name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # forced full run: component jobs ignore path filters

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- path filters (D3.1): unaffected components skip ----------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      contract: ${{ steps.f.outputs.contract }}
      admin: ${{ steps.f.outputs.admin }}
      android: ${{ steps.f.outputs.android }}
      mesh: ${{ steps.f.outputs.mesh }}
      infra: ${{ steps.f.outputs.infra }}
      ci: ${{ steps.f.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            # api-contract: the compose stack + schemathesis hooks live OUTSIDE backend/,
            # so contract-infra changes must trigger the job too (P1-CONTRACT).
            contract:
              - 'backend/**'
              - 'infra/**'
              - 'tests/**'
              - 'docs/api/**'
            admin:
              - 'admin-web/**'
            android:
              - 'android/**'
            mesh:
              - 'mesh-core/**'
            infra:
              - 'infra/**'
              - 'scripts/**'
              - 'Makefile'
              - 'docs/api/**'
              - 'tools/**'
              - 'e2e/**'
            ci:
              - '.github/**'

  # ---------- 1. lint and static analysis ----------
  lint-and-static:
    name: lint-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.ci == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.mesh == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks attributes findings to the introducing commit (fingerprint match)
      - name: actionlint (pinned)
        run: |
          curl -fsSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint && /tmp/actionlint -color
      - name: gitleaks (secret scan, pinned)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks && /tmp/gitleaks detect --no-banner --redact
      - name: OpenAPI lint (spectral)
        if: ${{ hashFiles('docs/api/openapi.yaml') != '' }}
        run: npx --yes @stoplight/spectral-cli@6 lint docs/api/openapi.yaml
      - name: Kotlin lint (ktlint/detekt) - lands with modules
        if: ${{ hashFiles('backend/**/*.kt', 'android/**/*.kt', 'mesh-core/**/*.kt') != '' }}
        run: echo "::notice::ktlint/detekt wired when backend/android modules land (Phase 1-2)."
      - name: Admin lint (eslint/tsc) - P1-4 admin shell
        if: ${{ hashFiles('admin-web/package.json') != '' }}
        run: |
          cd admin-web
          npm ci --ignore-scripts
          npm run typecheck        # production build sources (tsconfig.app+node)
          npm run typecheck:e2e    # playwright specs (standalone tsconfig)
          npm run lint

  # ---------- 2. backend tests (service containers, migrations, RBAC, ledger invariant, parity) ----------
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ridehailing
          POSTGRES_USER: ridehailing
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridehailing" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('backend/**/*.kt') == '' }}
        run: echo "::notice::backend module absent - skipping (Phase 1)." && exit 0
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('backend/**/*.kt') != '' }}
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('backend/**/*.kt') != '' }}
      - if: ${{ hashFiles('backend/**/*.kt') != '' }}
        run: |
          cd backend
          ./gradlew --no-daemon test jacocoTestReport
          # includes: migrations up (CI postgres service), RBAC matrix, ledger invariant
          # debits=credits, driver-DTO parity contract tests, WebSocket tests (D3.2)

  # ---------- 3. API contract: compose stack + schemathesis + k6 ----------
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, backend-test]
    if: ${{ needs.changes.outputs.contract == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('backend/Dockerfile') == '' }}
        run: echo "::notice::backend image absent - skipping contract stage (Phase 1)." && exit 0
      - if: ${{ hashFiles('backend/Dockerfile') != '' }}
        env:
          BACKEND_URL: http://localhost:8080
        run: |
          docker compose -f infra/docker-compose.yml --profile infra --profile app --profile test up -d
          ./scripts/wait-for-health.sh
          python3 -m pip install --quiet "schemathesis==4.34.0"
          # P1-CONTRACT: authenticated coverage via hooks (register/login/otp/refresh positive cases)
          SCHEMATHESIS_HOOKS=tests/contract/auth_hooks.py schemathesis run docs/api/openapi.yaml --url "$BACKEND_URL" --checks all --max-examples 10 --seed 45188991107
          # k6 smoke with p95 thresholds (D3.3) - wired when load-sensitive endpoints land

  # ---------- 4. admin web tests ----------
  admin-web-test:
    name: admin-web-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('admin-web/package.json') == '' }}
        run: echo "::notice::admin-web absent - skipping (module lands with P1-4)." && exit 0
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('admin-web/package.json') != '' }}
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - if: ${{ hashFiles('admin-web/package.json') != '' }}
        run: |
          cd admin-web
          npm ci
          npm run typecheck
          npm run lint
          npm test                      # vitest/RTL
          npx playwright install --with-deps chromium firefox
          npx playwright test           # chromium+firefox, route-mocked API (P1-4), axe checks
          # summary.json feeds the report gallery shard cards (tools/report/generate.js)
          node -e "const r=require('./artifacts/admin-playwright.json');const s=r.stats??{};require('fs').writeFileSync('artifacts/summary.json',JSON.stringify({tests:(s.expected??0)+(s.unexpected??0)+(s.skipped??0)+(s.flaky??0),passed:s.expected??0,failed:s.unexpected??0,skipped:s.skipped??0,flaky:[]}))"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('admin-web/package.json') != '' }}
        with:
          name: admin-web-evidence
          path: |
            admin-web/playwright-report/
            admin-web/artifacts/
            admin-web/test-results/
          retention-days: 14

  # ---------- 5. mesh-core simulation suite (Part C Stage 3, D3.5) ----------
  mesh-core-sim:
    name: mesh-core-sim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.mesh == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('mesh-core/**/*.kt') == '' }}
        run: echo "::notice::mesh-core absent - skipping (Phase 1b)." && exit 0
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('mesh-core/**/*.kt') != '' }}
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('mesh-core/**/*.kt') != '' }}
      - if: ${{ hashFiles('mesh-core/**/*.kt') != '' }}
        run: |
          cd mesh-core
          # GATE 3 (P1B-4): full suite (Stage 1/2/3) + simReport (evidence + baseline
          # regression gate; build fails if any mesh metric regresses >10%)
          ./gradlew --no-daemon test simReport
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mesh-core/**/*.kt') != '' }}
        with:
          name: mesh-sim-evidence
          path: docs/evidence/mesh-sim/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('mesh-core/**/*.kt') != '' }}
        with:
          name: mesh-test-results
          path: mesh-core/build/test-results/test/

  # ---------- 6. android build (once, artifacts reused) ----------
  android-build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('android/**/build.gradle.kts') == '' }}
        run: echo "::notice::android module absent - skipping (Phase 2)." && exit 0
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('android/**/build.gradle.kts') != '' }}
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('android/**/build.gradle.kts') != '' }}
      - if: ${{ hashFiles('android/**/build.gradle.kts') != '' }}
        run: |
          cd android
          gradle --no-daemon :app-rider:assembleDebug :app-driver:assembleDebug \
            :app-rider:assembleDebugAndroidTest :app-driver:assembleDebugAndroidTest \
            :app-rider:testDebugUnitTest :app-driver:testDebugUnitTest \
            :storyboard:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('android/**/build.gradle.kts') != '' }}
        with:
          name: android-apks
          path: |
            android/**/build/outputs/apk/**/*.apk
            android/**/build/outputs/androidTest/**/*.apk

  # ---------- 7/8. sharded emulator UI tests (rider and driver in parallel) ----------
  android-ui-rider:
    name: android-ui-rider
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, android-build]
    if: ${{ needs.changes.outputs.android == 'true' && needs.android-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # Suites smaller than the shard count leave empty shards (connectedAndroidTest
        # fails on zero tests) - collapse to 1 shard until the suites grow (P2-3 note).
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('android/**/build.gradle.kts') == '' }}
        run: echo "::notice::android absent - skipping shard." && exit 0
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('android/**/build.gradle.kts') != '' }}
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM (D4)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: android-apks }
      - run: make up-test && ./scripts/wait-for-health.sh && ./scripts/seed-test.sh rider-${{ matrix.shard }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_apis (NOT aosp_atd): ATD images disable the display pipeline by design -
          # accessibility works but screenshots/screenrecord are solid black (runs
          # 45498794440/45496557524). Real pixel evidence needs a rendering target.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./scripts/run-ui-tests.sh rider ${{ matrix.shard }} 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-rider-${{ matrix.shard }}
          path: artifacts/**

  android-ui-driver:
    name: android-ui-driver
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, android-build]
    if: ${{ needs.changes.outputs.android == 'true' && needs.android-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # Suites smaller than the shard count leave empty shards (connectedAndroidTest
        # fails on zero tests) - collapse to 1 shard until the suites grow (P2-3 note).
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('android/**/build.gradle.kts') == '' }}
        run: echo "::notice::android absent - skipping shard." && exit 0
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('android/**/build.gradle.kts') != '' }}
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM (D4)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: android-apks }
      - run: make up-test && ./scripts/wait-for-health.sh && ./scripts/seed-test.sh driver-${{ matrix.shard }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_apis (NOT aosp_atd): ATD images disable the display pipeline by design -
          # see the android-ui-rider comment.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./scripts/run-ui-tests.sh driver ${{ matrix.shard }} 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-driver-${{ matrix.shard }}
          path: artifacts/**

  # ---------- 9. cross-actor E2E (D5): two emulators + admin, simultaneous ----------
  e2e-cross-actor:
    name: e2e-cross-actor
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [changes, android-build]
    if: ${{ needs.changes.outputs.android == 'true' && needs.android-build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('android/**/build.gradle.kts') == '' }}
        run: echo "::notice::android absent - skipping cross-actor (Phase 2+)." && exit 0
      - name: Enable KVM (D4)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: android-apks }
      - run: make up-test && ./scripts/wait-for-health.sh && ./scripts/seed-test.sh e2e
      - name: Install emulator + system image (this job does not use android-emulator-runner)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Create AVD + start two emulators (tri-view)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n e2e_api34 -k "system-images;android-34;google_apis;x86_64" -d pixel_5
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          ls -la "$ANDROID_AVD_HOME" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd || true
          ./scripts/start-emulators.sh 2
      - name: Orchestrate two emulators + admin (tri-view recording)
        run: |
          cd e2e && npm ci && RECORD_ALL=1 node orchestrator.js --scenario all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-cross-actor
          path: artifacts/**

  # ---------- 9b. offline maps e2e (P3-2: geo stack + airplane-mode render proof) ----------
  e2e-offline-maps:
    name: e2e-offline-maps
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [changes, android-build]
    if: ${{ (needs.changes.outputs.android == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') && needs.android-build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM (D4)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: android-apks }
      - name: Build the city extract (Planetiler -> MBTiles, self-hosted tiles only)
        run: |
          mkdir -p infra/data
          if [ ! -f infra/data/city.mbtiles ]; then
            # --download: planetiler fetches the Monaco extract AND its aux datasets
            # itself (--download=false was a fetch-map-data.sh bug: the aux files were
            # never pre-fetched, so the build died on lake_centerline.parquet)
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/infra/data:/data" ghcr.io/onthegomap/planetiler:latest --area=monaco --download --mbtiles=/data/city.mbtiles
          fi
          ls -la infra/data/
      - name: Start the self-hosted tile server (standalone; host port 8081 -> emulator 10.0.2.2:8081)
        run: |
          docker run -d --name tileserver -p 8081:8081 -v "$PWD/infra/data:/data" maptiler/tileserver-gl:v4.6.2 --mbtiles /data/city.mbtiles -p 8081
          for i in $(seq 1 30); do
            if curl -fsSI "http://localhost:8081/styles/basic/style.json" | head -1 | grep -q "200"; then echo "tile server up (attempt $i/30)"; break; fi
            echo "waiting for tile server (attempt $i/30)"
            sleep 2
          done
          curl -fsSI "http://localhost:8081/styles/basic/style.json" | head -1
      - name: Install emulator + system image
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Create AVD + boot one emulator
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n offline_api34 -k "system-images;android-34;google_apis;x86_64" -d pixel_5
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          ./scripts/start-emulators.sh 1
      - name: Install rider + androidTest APKs
        run: |
          adb install -r app-rider-debug.apk
          adb install -r app-rider-debug-androidTest.apk
      - name: ONLINE - download the offline region (instrumented)
        run: |
          adb shell am instrument -w -e class com.ridehailing.rider.OfflineMapsInstrumentedTest#downloadRegionOffline             com.ridehailing.rider/test/androidx.test.runner.AndroidJUnitRunner | tee artifacts-offline-download.log
          grep -q "INSTRUMENTATION_STATUS_CODE: 0" artifacts-offline-download.log
      - name: AIRPLANE MODE (svc wifi/data disable; no root needed on google_apis)
        run: |
          adb shell svc wifi disable
          adb shell svc data disable
          sleep 5
          adb shell settings get global airplane_mode_on || true
      - name: OFFLINE - app boots + region persists (instrumented; storyboard screenshots = gallery evidence)
        run: |
          adb shell am instrument -w -e class com.ridehailing.rider.OfflineMapsInstrumentedTest#mapRendersFromOfflineRegion             com.ridehailing.rider/test/androidx.test.runner.AndroidJUnitRunner | tee artifacts-offline-render.log
          grep -q "INSTRUMENTATION_STATUS_CODE: 0" artifacts-offline-render.log
      - name: Restore connectivity (job hygiene)
        if: always()
        run: |
          adb shell svc wifi enable || true
          adb shell svc data enable || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-offline-maps
          path: artifacts-offline-*.log

  # ---------- 10. security scans (always) ----------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full-history scan; fingerprints in .gitleaksignore match introducing commits
      - name: gitleaks history scan (pinned)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '0'   # findings reported; gating starts when runtime code lands (DECISIONS)
          vuln-type: os,library
          format: table
      - name: Trivy image scan (admin-web; backend image scan lands with shared build artifacts, D9)
        if: ${{ hashFiles('admin-web/Dockerfile') != '' }}
        run: |
          docker build --build-arg VITE_API_BASE=http://localhost:8080 -t admin-web:scan admin-web
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --severity HIGH,CRITICAL --exit-code 0 admin-web:scan
      - name: Backend image scan - lands with image-build sharing
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        run: echo "::notice::backend image scan deferred - api-contract builds it; sharing lands with the P0-C pipeline work."

  # ---------- 11. report gallery (E6) ----------
  report-publish:
    name: report-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-static, backend-test, api-contract, admin-web-test, mesh-core-sim, android-build, android-ui-rider, android-ui-driver, e2e-cross-actor, security]
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # purge stale github-pages artifacts on reruns (D50)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Purge stale github-pages artifacts of this run (rerun-safe deploy, D50)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          run_id="${{ github.run_id }}"
          ids="$(gh api "repos/$repo/actions/artifacts?name=github-pages&per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id == $run_id) | .id" || true)"
          for id in $ids; do
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" >/dev/null 2>&1 \
              && echo "purged stale github-pages artifact $id" || true
          done
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true   # first runs have no component artifacts yet
      - name: Generate report gallery
        env:
          PAGES_BASE: https://stev199.github.io/ride-hailing-platform
        run: |
          mkdir -p _site
          node tools/report/generate.js --artifacts artifacts --out _site
          # Ship the media with the site: generate.js writes only index.html, and the
          # filmstrip/video srcs are artifact-relative (ui-<app>-<shard>/...). Every gallery
          # image/video 404'd until now because this copy was missing (found while landing
          # the P2-3 storyboard filmstrip, run 45494296659). android-apks (~20MB) is build
          # output, not gallery evidence - excluded from the site. Docs-only pushes have no
          # component artifacts at all (download-artifact ran continue-on-error) - skip.
          if [ -d artifacts ]; then
            cp -r artifacts/. _site/
            rm -rf _site/android-apks
          else
            echo "::notice::no component artifacts on this run - gallery ships without media"
          fi
      - name: Restore gallery history - last 30 successful runs (E6)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          ids="$(gh api "repos/$repo/actions/runs?status=success&per_page=60" \
            --jq '[.workflow_runs[] | select(.name == "CI") | .id] | .[0:30][]' || true)"
          for rid in $ids; do
            if [ "$rid" = "${{ github.run_id }}" ]; then continue; fi
            if gh run download "$rid" -n "test-report-$rid" -D "_hist/$rid" 2>/dev/null; then
              mkdir -p "_site/runs/$rid"
              cp -r "_hist/$rid/." "_site/runs/$rid/" || true
              # The fallback artifact embeds the WHOLE _site of that run (incl. its own
              # restored history). A run page must contain only ITS report - dropping the
              # nested runs/ dir keeps snapshots one level deep (D66, no re-amplification).
              rm -rf "_site/runs/$rid/runs" || true
              echo "restored gallery history for run $rid"
            fi
          done
      - name: Snapshot current run + /latest alias
        run: |
          # Snapshot ONLY the freshly generated gallery (everything at _site depth-1
          # EXCEPT the restored runs/ history): each historical artifact contains its
          # own history snapshot, so copying _site/* recursively here grows the site
          # multiplicatively and blew the 15-min job timeout (upload hang -> cancel).
          mkdir -p _site/runs/${{ github.run_id }}
          find _site -maxdepth 1 -mindepth 1 ! -name runs ! -name latest \
            -exec cp -r {} _site/runs/${{ github.run_id }}/ \;
          rm -rf _site/latest && mkdir -p _site/latest
          find _site -maxdepth 1 -mindepth 1 ! -name runs ! -name latest \
            -exec cp -r {} _site/latest/ \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload fallback artifact (E6.2)
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: _site
      - name: Settle before deploy (artifact metadata is eventually consistent)
        run: |
          # deploy-pages@v4 queries the Pages API for the artifact seconds after upload;
          # at least two runs failed with "Fetching artifact metadata failed ... No
          # artifacts named github-pages" even though the artifact existed (verified via
          # the artifacts API). A 10 s settle window absorbs the propagation lag.
          sleep 10
      - name: Deploy to Pages (main only)
        id: pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/deploy-pages@v4

  # ---------- 12. ci-summary: the only required check ----------
  ci-summary:
    name: ci-summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-static, backend-test, api-contract, admin-web-test, mesh-core-sim, android-build, android-ui-rider, android-ui-driver, e2e-cross-actor, security, report-publish]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    env:
      PAGES_BASE: https://stev199.github.io/ride-hailing-platform
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ toJson(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const order = ["changes","lint-and-static","backend-test","api-contract","admin-web-test","mesh-core-sim","android-build","android-ui-rider","android-ui-driver","e2e-cross-actor","security","report-publish","ci-summary"];
            const icon = r => r === "success" ? "PASS" : r === "skipped" ? "SKIP" : "FAIL";
            const rows = order.filter(n => needs[n]).map(n => `| ${n} | ${icon(needs[n].result)} |`).join("\n");
            const bad = order.filter(n => needs[n] && (needs[n].result === "failure" || needs[n].result === "cancelled"));
            const md = `### CI summary (${process.env.GITHUB_SHA})\n\n| job | result |\n|---|---|\n${rows}\n\nRun: ${process.env.RUN_URL}\nReport: ${process.env.PAGES_BASE}/runs/${process.env.GITHUB_RUN_ID}/ (artifact test-report-${process.env.GITHUB_RUN_ID})\n`;
            require("fs").writeFileSync("/tmp/summary.md", md);
            require("fs").writeFileSync("/tmp/bad.txt", bad.join(" "));
          '
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(cat /tmp/bad.txt)" ]; then
            echo "::error::failing jobs: $(cat /tmp/bad.txt)"
            echo "CI_FAILED=1" >> "$GITHUB_ENV"
          fi
      - name: Update PR comment (E6.3)
        if: ${{ github.event_name == 'pull_request' && env.CI_FAILED != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .id' | head -n1 || true)
          BODY=$(cat /tmp/summary.md)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
          fi
      - name: Fail on failed jobs
        if: ${{ env.CI_FAILED == '1' }}
        run: exit 1

# Fork-PR safety (Part 0 rule): jobs using repository secrets (release signing, live-view,
# staging deploy) are dispatch/tag-gated or guarded with
#   github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
