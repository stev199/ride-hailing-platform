name: Nightly

on:
  schedule:
    - cron: '30 2 * * *' # full matrix stays out of PR runs (cost control)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-nightly:
    name: security-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks full-history scan
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact
      - name: Trivy fs (HIGH/CRITICAL, fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '0'   # becomes '1' once runtime code lands (Phase 1+, DECISIONS D-cost)

  mesh-long-sim:
    name: mesh-long-sim
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -d mesh-core ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::mesh-core absent (Phase 1b)"; fi
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.present == 'true'
      - if: steps.guard.outputs.present == 'true'
        run: |
          cd mesh-core
          # GATE 3 suite (19 scenarios, fixed seeds) + baseline regression gate
          # (>10% metric drift fails) + fresh evidence. The aspirational
          # 'sim --scenario=long' never matched the build script and failed
          # every nightly since mesh-core landed; scenario selection lands
          # with the long-mode runner (BACKLOG).
          gradle --no-daemon simReport

  android-nightly:
    name: android-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]
        locale: [en, fr, ar]
        theme: [light, dark]
        exclude:
          - api-level: 26
            locale: fr
          - api-level: 26
            locale: ar
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -d android ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::android absent (Phase 2)"; fi
      - name: Enable KVM (D4)
        if: steps.guard.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with: { distribution: temurin, java-version: '17' }
      - if: steps.guard.outputs.present == 'true'
        run: make up-test && ./scripts/wait-for-health.sh && ./scripts/seed-test.sh nightly-${{ matrix.api-level }}-${{ matrix.locale }}-${{ matrix.theme }}
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.guard.outputs.present == 'true'
        with:
          api-level: ${{ matrix.api-level }}
          # google_apis (NOT aosp_atd): ATD disables the display pipeline - screenshots black.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put system system_locales ${{ matrix.locale }}
            # uiautomator locale/theme variant capture (E2); font-scale 1.3 capture is
            # the dedicated android-screenshot-cells matrix (P2-5), not this matrix.
            ./scripts/run-ui-tests.sh all 0 1

  # P2-5 (Phase 2 gate deferral closed): font-scale + small/large-phone screenshot
  # cells. The locale/theme matrix above keeps the accent coverage; this job proves
  # LAYOUT robustness: system font_scale 1.3 (large-font accessibility) and two AVD
  # skins (small_phone 720x1280@320dpi small vs pixel_5 1080x2340 large).
  # small_phone replaces nexus_4 (round-10 fix: Google dropped the Nexus 4 device
  # profile from the SDK - runner avdmanager fails with "No device found matching
  # --device nexus_4"; small_phone is a generic profile in devices.xml, same ~360x640dp
  # footprint). Storyboard screenshots
  # land as run artifacts per cell (nightly evidence; gallery cross-publish stays an
  # E6 follow-up - recorded in the BACKLOG row).
  android-screenshot-cells:
    name: android-screenshot-cells
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { font-scale: '1.0', profile: small_phone }
          - { font-scale: '1.0', profile: pixel_5 }
          - { font-scale: '1.3', profile: small_phone }
          - { font-scale: '1.3', profile: pixel_5 }
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -d android ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::android absent (Phase 2)"; fi
      - name: Enable KVM (D4)
        if: steps.guard.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "KVM missing"; exit 1; }
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with: { distribution: temurin, java-version: '17' }
      - if: steps.guard.outputs.present == 'true'
        run: make up-test && ./scripts/wait-for-health.sh && ./scripts/seed-test.sh shots-${{ matrix.profile }}-${{ matrix.font-scale }}
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.guard.outputs.present == 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put system font_scale ${{ matrix.font-scale }}
            ./scripts/run-ui-tests.sh all 0 1
      - uses: actions/upload-artifact@v7
        if: always() && steps.guard.outputs.present == 'true'
        with:
          name: shots-${{ matrix.profile }}-font${{ matrix.font-scale }}
          path: artifacts/**

  backend-nightly:
    name: backend-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('backend/**/*.kt') == '' }}
        run: echo "::notice::backend absent (Phase 1) - k6 load test + long integration runs wired then." && exit 0
      - run: echo "backend present - nightly load tests wired with backend"

  nightly-summary:
    name: nightly-summary
    needs: [security-nightly, mesh-long-sim, android-nightly, android-screenshot-cells, backend-nightly]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(needs).filter(([,v]) => v.result === "failure" || v.result === "cancelled");
            if (bad.length) { console.error("failing:", bad.map(([k]) => k).join(" ")); process.exit(1); }
            console.log("Nightly green (skips allowed until modules land).");
          '
