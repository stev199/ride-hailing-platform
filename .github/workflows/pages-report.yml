name: Pages Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery index
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          mkdir -p _site
          {
            echo '<!doctype html>'
            echo '<html><head><meta charset="utf-8"><title>ride-hailing-platform report gallery</title>'
            echo '<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:880px;margin:2rem auto;padding:0 1rem;color:#111827}h1{font-size:1.5rem}code{background:#f3f4f6;padding:.1rem .35rem;border-radius:3px}table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{border:1px solid #d1d5db;padding:.5rem;text-align:left}</style>'
            echo '</head><body>'
            echo '<h1>ride-hailing-platform &mdash; report gallery</h1>'
            echo "<p>Generated by <code>pages-report.yml</code> for run <strong>#${RUN_NUM}</strong> (id ${RUN_ID}) on commit <code>${SHA}</code>.</p>"
            echo '<table><tr><th>Commit</th><th>Run</th><th>Generated (UTC)</th></tr>'
            echo "<tr><td><code>${SHA}</code></td><td>#${RUN_NUM}</td><td>$(date -u '+%Y-%m-%d %H:%M:%S')</td></tr></table>"
            echo '<p>Per-run build and test reports will be added in later phases.</p>'
            echo '</body></html>'
          } > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
