server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (login, users, audit...) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching of the shell (index.html) so new deploys pick up immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
