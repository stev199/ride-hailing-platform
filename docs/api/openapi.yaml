openapi: "3.1.0"
info:
  title: ride-hailing-platform API
  version: "0.1.0"
  contact:
    name: ride-hailing-platform maintainers
    url: https://github.com/stev199/ride-hailing-platform
  description: >
    Tracks the IMPLEMENTED API surface only; endpoints are added as they land (B-01..). Auth endpoints return with P1-2. All writes are
    validated server-side; all admin endpoints are RBAC-gated; every state change is
    recorded in the append-only event store.
servers:
  - url: http://localhost:8080
    description: local compose stack
tags:
  - name: system
    description: Liveness and health probes.
  - name: auth
    description: Registration, login (password/OTP), token lifecycle, profile, own sessions.
  - name: admin
    description: RBAC-gated admin operations (P1-3); every mutation is audited in the hash-chained event store.
  - name: config
    description: Signed config bundles (P1-5a) - public device serving + RBAC-gated admin read/patch.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/health probe
      description: Used by compose healthchecks and CI wait scripts.
      tags: [system]
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/auth/register:
    post:
      operationId: register
      description: Registers a RIDER account with a password and a unique phone and/or email. Returns the initial token pair.
      summary: Register with password and a unique phone or email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created; token pair returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/login/password:
    post:
      operationId: loginWithPassword
      description: Password login. Unknown identifier and wrong password return the same error (no user-enumeration oracle).
      summary: Password login with phone/email identifier
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      description: Generates and dispatches a 6-digit OTP (hashed at rest, 5-minute expiry, attempt- and rate-limited).
      summary: Issue a 6-digit OTP over an admin-enabled channel
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpIssued"
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      description: Verifies the OTP for an issued requestId. Logs the user in, or auto-registers a RIDER when enabled by admin config.
      summary: Verify an OTP; logs in or auto-registers (admin toggle)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Verified; token pair returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      description: Rotates the refresh token for the session family. Presenting a consumed token revokes the whole family.
      summary: Rotate the refresh token; reuse revokes the family
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refreshed"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the refresh-token family so no further refreshes are possible.
      summary: Revoke the refresh-token family
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out
        "400": { $ref: "#/components/responses/ValidationError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/me:
    get:
      operationId: getMe
      description: Returns the profile of the authenticated user (bearer access token required).
      summary: Current authenticated user profile
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/sessions:
    get:
      operationId: listMySessions
      description: Live sessions (refresh families) of the authenticated user; one entry per login (P1-3).
      summary: List own sessions
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live sessions, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/sessions/{familyId}:
    delete:
      operationId: revokeMySession
      description: Revokes one of the caller's OWN sessions by family id; a foreign or unknown id is 404 (P1-3).
      summary: Revoke one own session
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      description: Search/list users (USERS_READ). Case-insensitive substring match over phone, email and displayName.
      summary: List/search users
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateUser
      description: Creates a user with any role (USERS_WRITE). ADMIN_* roles additionally require ADMIN_SUPER (403 otherwise). Audited.
      summary: Create a user
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}:
    get:
      operationId: adminGetUser
      description: Fetch one user by id (USERS_READ).
      summary: Get a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: adminPatchUser
      description: Edit displayName/locale/status/role (USERS_WRITE). ADMIN_* role assignment and self role/status changes are 403. Audited with before/after values.
      summary: Edit a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPatchUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetPassword
      description: Sets a new password (USERS_RESET_PASSWORD) and revokes ALL of the target's sessions. The audit event never contains the password. Audited.
      summary: Reset a user's password
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPassword"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}/force-logout:
    post:
      operationId: adminForceLogout
      description: Revokes every live session of the target (SESSIONS_ADMIN); the response reports how many were revoked. Self force-logout is 400. Audited.
      summary: Force logout a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceLogoutResult"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/audit:
    get:
      description: Tail of the hash-chained audit/event log (AUDIT_READ); verifyOk reports whether the whole chain recomputes.
      operationId: adminAuditTail
      summary: Read the audit tail
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: Audit tail + chain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/config:
    get:
      operationId: getConfigBundle
      description: >-
        Public signed configuration bundle (P1-5a). `config` is the EXACT canonical JSON string
        the Ed25519 `signature` covers: verify over "version|config|issuedAtEpochSec" with the
        served `publicKey`, and reject version <= the highest version already accepted
        (anti-rollback). No authentication - devices fetch the bundle pre-login; the signature
        is the trust anchor.
      summary: Current signed config bundle (public)
      tags: [config]
      responses:
        "200":
          description: Current signed bundle (version 1 is bootstrapped on first read)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundle"
  /v1/admin/config/login-methods:
    get:
      operationId: adminGetLoginMethods
      description: >-
        Current login-methods state + signed-bundle history (CONFIG_READ). OTP reads back the
        exact structures PATCH accepts; `devOnly` channels are deployment properties (D37) and
        are not patchable.
      summary: Read login methods config
      tags: [config]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current state + full version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfig"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: adminPatchLoginMethods
      description: >-
        Patch the live login methods (CONFIG_WRITE). Absent fields are no-ops; JSON null equals
        absent (D46). Every accepted patch bumps the config version, re-signs the bundle and
        appends a `config.login_methods.updated` audit event; the change affects the very next
        auth call. Validation failures answer 400 with codes empty_patch, unknown_channel,
        invalid_priority or duplicate_priority (enabled channels must keep distinct priorities).
      summary: Patch login methods (publishes a new signed version)
      tags: [config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginMethodsPatch"
      responses:
        "200":
          description: The published version entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rides/estimate:
    post:
      operationId: estimateFare
      description: >-
        Ride-type fare ESTIMATE ranges (spec §pricing: "Estimated price. This is not the final
        price." - the range is low=no-surge, high=max surge; the client renders the permanent
        disclaimer). Distance/time come from the self-hosted OSRM route service; when it is
        unreachable the response degrades to the calibrated straight-line fallback and
        routeSource=straight_line (never a 5xx). The final quote is a separate signed server
        document created at booking (P4-2). Any authenticated user may estimate (read-only,
        no rider-specific data).
      summary: Estimate fares for a pickup/dropoff pair
      tags: [rides]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FareEstimateRequest"
      responses:
        "200":
          description: Per-ride-type estimate ranges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareEstimateResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/config/fares:
    get:
      operationId: adminGetFares
      description: >-
        The current fares section of the signed config bundle (CONFIG_READ) - the exact
        document the device caches from GET /v1/config (spec §pricing).
      summary: Read fares config
      tags: [config]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current fares section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareConfig"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: adminPatchFares
      description: >-
        Replace the WHOLE fares section (D75 full-replace semantics; the nested per-city map
        makes field-wise patches explode - the admin UI sends the edited document). Every
        accepted patch bumps the config version, re-signs the device bundle and appends a
        `config.fares.updated` audit event. Validation failures answer 400 invalid_fares and
        never burn a version.
      summary: Replace fares config (publishes a new signed version)
      tags: [config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FareConfig"
      responses:
        "200":
          description: The stored fares section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareConfig"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rides:
    get:
      operationId: listMyRides
      description: The caller's OWN rides, newest first (rider-scoped).
      summary: List my rides
      tags: [rides]
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: Page size (default 20). Out-of-range = 400 invalid_pagination. }
        # maximum: 2147483647 mirrors the server parser (toIntOrNull -> Int32). Without
        # it the generator produced 9223372036854775808 (schema-valid, Int32-unparseable)
        # and a schema-valid request was rejected 400 (round-12 ST202).
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }, description: Page offset (default 0). }
      responses:
        "200":
          description: Ride page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideListDto"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: bookRide
      description: >-
        Book a ride (RIDER role only - 403 booking_role_required). Creates the trip in
        REQUESTED with the server-SIGNED final quote (spec §pricing: authoritative,
        admin-configurable validity window, upfront-locked or metered-with-cap policy).
        v1 accepts CASH only (WALLET/POINTS become bookable in Phase 7 - 400
        payment_method_unavailable). Coordinates/city/rideType validation mirrors the
        estimate endpoint (invalid_coordinates / unknown_city / unknown_ride_type).
      summary: Book a ride
      tags: [rides]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideCreateRequest"
      responses:
        "201":
          description: Ride created (REQUESTED) with the signed quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideDto"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rides/{id}:
    get:
      operationId: getMyRide
      description: >-
        Rider-owned ride detail (404 ride_not_found for unknown AND not-owned - no
        existence leak). A REQUESTED ride past its quote validity transitions to EXPIRED
        on read (event ride.expired; the quote window is the booking clock, spec §pricing).
      summary: Get my ride
      tags: [rides]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ride detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/rides/{id}/cancel:
    post:
      operationId: cancelMyRide
      description: >-
        Rider-owned cancel of a REQUESTED ride (409 cancel_not_allowed once accepted/
        terminal - post-accept rules arrive with the driver app, Phase 5). Applies the
        ride type's configured cancel fee to the double-entry ledger (rider DEBIT,
        platform CREDIT; ride.cancelled audit event) and returns the cancelled ride.
      summary: Cancel my ride (pre-accept)
      tags: [rides]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/driver/duty:
    post:
      operationId: setDriverDuty
      description: >-
        Driver duty toggle with the driver's last known position (P5). Duty state is a
        per-process registry (restart clears it; drivers re-toggle) and every transition
        is audited (event driver.duty). The dispatch board requires duty ON.
      summary: Set driver duty (online/offline) with position
      tags: [driver]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDutyRequest"
      responses:
        "200":
          description: Duty accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDutyDto"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/driver/rides/available:
    get:
      operationId: listAvailableRides
      description: >-
        Dispatch board (P5): REQUESTED rides closest first (straight-line distance from
        the duty position). 409 duty_offline when the driver is not on duty. Rides past
        their quote validity are lazily expired on accept, never served as claimable.
      summary: List dispatch candidates (closest first)
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Dispatch board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideListDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /v1/driver/rides:
    get:
      operationId: listMyDriverRides
      description: Rides assigned to THIS driver, newest first (driver trip history).
      summary: List my assigned rides
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2147483647 } }
      responses:
        "200":
          description: Assigned rides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideListDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /v1/rides/{id}/accept:
    post:
      operationId: acceptRide
      description: >-
        ATOMIC single-winner claim (P5): REQUESTED -> ACCEPTED + driver. Two racing
        drivers yield exactly one winner (409 already_accepted for the loser); a ride
        past its quote validity is lazily expired first (409 ride_expired). DRIVER only.
      summary: Accept (claim) a requested ride
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Claimed ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/rides/{id}/arrive:
    post:
      operationId: driverArrive
      description: Driver-owned transition ACCEPTED -> ARRIVED (only the assigned driver; 403 not_your_ride, 409 illegal_transition).
      summary: Mark arrival at pickup
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/rides/{id}/start:
    post:
      operationId: driverStart
      description: Driver-owned transition ARRIVED -> IN_PROGRESS (only the assigned driver; 409 illegal_transition otherwise).
      summary: Start the trip
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/rides/{id}/complete:
    post:
      operationId: driverComplete
      description: Driver-owned terminal transition IN_PROGRESS -> COMPLETED (ride.completed audit event; CASH settlement posts with the Phase 7 wallet work).
      summary: Complete the trip
      tags: [driver]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Completed ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRideDto"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DriverDutyRequest:
      type: object
      required: [online, lat, lon]
      properties:
        online: { type: boolean }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lon: { type: number, format: double, minimum: -180, maximum: 180 }
    DriverDutyDto:
      type: object
      required: [online, lat, lon, updatedAtEpochSec]
      properties:
        online: { type: boolean }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        updatedAtEpochSec: { type: integer, format: int64 }
    DriverQuoteDto:
      type: object
      description: The quote the rider agreed to, verbatim (driver sees the same price fields; no rider PII anywhere in driver DTOs).
      required: [amountMinor, currency, mode, meteredCapMinor, validUntilEpochSec]
      properties:
        amountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        mode: { type: string, enum: [upfront_locked, metered_capped] }
        meteredCapMinor: { type: integer, format: int64 }
        validUntilEpochSec: { type: integer, format: int64 }
    DriverRideDto:
      type: object
      required: [id, status, city, rideType, paymentMethod, pickupLat, pickupLon, dropoffLat, dropoffLon, quote, cancelFeeMinor, createdAtEpochSec, updatedAtEpochSec]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED_BY_RIDER, CANCELLED_BY_DRIVER, CANCELLED_TIMEOUT, EXPIRED] }
        city: { type: string }
        rideType: { type: string }
        paymentMethod: { type: string }
        note: { type: [string, "null"] }
        pickupLat: { type: number, format: double }
        pickupLon: { type: number, format: double }
        dropoffLat: { type: number, format: double }
        dropoffLon: { type: number, format: double }
        pickupName: { type: [string, "null"] }
        dropoffName: { type: [string, "null"] }
        quote: { $ref: "#/components/schemas/DriverQuoteDto" }
        cancelFeeMinor: { type: integer, format: int64 }
        createdAtEpochSec: { type: integer, format: int64 }
        updatedAtEpochSec: { type: integer, format: int64 }
        distanceMeters: { type: number, format: double }
    DriverRideListDto:
      type: object
      required: [rides, limit, offset]
      properties:
        rides: { type: array, items: { $ref: "#/components/schemas/DriverRideDto" } }
        limit: { type: integer }
        offset: { type: integer }
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
    OtpRequest:
      type: object
      required: [channel, target]
      properties:
        channel:
          type: string
          enum: [sms, telegram, email, whatsapp]
        target:
          type: string
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    OtpVerify:
      type: object
      required: [requestId, code]
      properties:
        requestId:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: 6-digit numeric OTP; wrong or unknown codes return 401.
        displayName:
          type: [string, "null"]
          description: >-
            Optional profile name for auto-registration. Any value is accepted;
            invalid or missing values fall back to a server default ("Rider").
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    RegisterRequest:
      type: object
      required: [displayName, password]
      anyOf:
        # At least one NON-NULL identifier (mirrors backend identifier_required,
        # D49: required alone would let explicit nulls satisfy the branch).
        - required: [phone]
          properties:
            phone:
              type: string
        - required: [email]
          properties:
            email:
              type: string
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
          description: >-
            2-64 characters with at least one non-whitespace; stored trimmed.
            All-whitespace values are rejected with 400 invalid_display_name.
        password:
          type: string
          minLength: 10
          maxLength: 128
        phone:
          type: [string, "null"]
          pattern: '^(?:[^0-9]*[0-9]){8,15}[^0-9]*$'
          description: >-
            8-15 ASCII digits; every other character (spaces, dashes,
            parentheses, a leading +) is ignored during normalization. Values
            with fewer than 8 or more than 15 digits are rejected with 400
            invalid_phone.
        email:
          type: [string, "null"]
          pattern: '^[^@]+@[^@]*[^@.]$'
          description: >-
            One '@' with a non-empty local part and a domain not ending in
            '.'. Stored trimmed and lowercased. Values without '@', with '@'
            at either end, or ending in '.' are rejected with 400
            invalid_email.
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    PasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    OtpIssued:
      type: object
      required: [requestId, expiresInSeconds, resendAfterSeconds]
      properties:
        requestId:
          type: string
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
    TokenPairDto:
      type: object
      required: [accessToken, refreshToken, accessExpiresAtEpochSec]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAtEpochSec:
          type: integer
    User:
      type: object
      required: [id, displayName, role, status, locale]
      properties:
        id:
          type: string
        phone:
          type: [string, "null"]
          pattern: '^[0-9]{8,15}$'
          description: Normalized digits-only phone (8-15 ASCII digits).
        email:
          type: [string, "null"]
        displayName:
          type: string
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        status:
          type: string
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        locale:
          type: string
    AuthSuccess:
      type: object
      required: [user, tokens, created]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPairDto"
        created:
          type: boolean
    Refreshed:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPairDto"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: [string, "null"]
    AdminUser:
      type: object
      required: [id, phone, email, displayName, role, status, locale, createdAtEpochSec]
      properties:
        id:
          type: string
        phone:
          type: [string, "null"]
          pattern: '^[0-9]{8,15}$'
          description: Normalized digits-only phone (8-15 ASCII digits); null for email-only accounts.
        email:
          type: [string, "null"]
        displayName:
          type: string
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        status:
          type: string
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        locale:
          type: string
        createdAtEpochSec:
          type: integer
    AdminUserList:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        limit:
          type: integer
        offset:
          type: integer
    AdminCreateUser:
      type: object
      required: [displayName, role]
      anyOf:
        - required: [phone]
          properties:
            phone: { type: string }
        - required: [email]
          properties:
            email: { type: string }
      description: At least one identifier (phone OR email) is required - an all-identifier-less create is 400 identifier_required.
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        phone:
          type: [string, "null"]
          pattern: '^(?:[^0-9]*[0-9]){8,15}[^0-9]*$'
          description: 8-15 ASCII digits; every other character (spaces, dashes, parentheses, a leading +) is ignored during normalization. Values with fewer than 8 or more than 15 digits are rejected with 400 invalid_phone (same shape as RegisterRequest.phone).
        email:
          type: [string, "null"]
          pattern: '^[^@]+@[^@]*[^@.]$'
          description: One '@' with a non-empty local part and a domain not ending in '.' (same shape as RegisterRequest.email); other values are rejected with 400 invalid_email.
        password:
          type: [string, "null"]
          minLength: 10
          maxLength: 128
          description: Optional initial password (policy-checked); omit for OTP-only accounts.
        locale:
          type: [string, "null"]
    AdminPatchUser:
      type: object
      properties:
        displayName:
          type: [string, "null"]
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
        locale:
          type: [string, "null"]
          enum: [en, fr, ar, null]
          description: Server-supported values en, fr, ar; other values are rejected with 400 invalid_locale.
        status:
          type: [string, "null"]
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        role:
          type: [string, "null"]
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
    AdminResetPassword:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ForceLogoutResult:
      type: object
      required: [revokedSessions]
      properties:
        revokedSessions:
          type: integer
    Session:
      type: object
      required: [familyId, deviceId, createdAtEpochSec, lastRotatedEpochSec]
      properties:
        familyId:
          type: string
        deviceId:
          type: [string, "null"]
        createdAtEpochSec:
          type: integer
        lastRotatedEpochSec:
          type: integer
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    AuditEvent:
      type: object
      required: [seq, type, occurredAt, payloadJson, hash]
      properties:
        seq:
          type: integer
        type:
          type: string
        occurredAt:
          type: string
        payloadJson:
          type: string
          description: Canonical JSON of the event payload (keys sorted); contains no secrets.
        hash:
          type: string
    AuditTail:
      type: object
      required: [verifyOk, events]
      properties:
        verifyOk:
          type: boolean
          description: True when the whole chain recomputes (tamper check).
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    ConfigBundle:
      type: object
      required: [version, issuedAtEpochSec, config, signature, publicKey]
      properties:
        version:
          type: integer
          format: int64
          description: Monotonic config version; devices reject version <= last accepted.
        issuedAtEpochSec:
          type: integer
          format: int64
        config:
          type: string
          description: The exact canonical JSON string the signature covers (verify verbatim; do not re-serialize a parsed object).
        signature:
          type: string
          description: Ed25519 signature over "version|config|issuedAtEpochSec", hex-encoded.
        publicKey:
          type: string
          description: Ed25519 public key (X.509 SubjectPublicKeyInfo DER), hex-encoded.
    ConfigVersion:
      type: object
      required: [version, issuedAtEpochSec, config, signature, changedBy, change]
      properties:
        version:
          type: integer
          format: int64
        issuedAtEpochSec:
          type: integer
          format: int64
        config:
          type: string
        signature:
          type: string
        changedBy:
          type: string
          description: Actor id ("system" for the bootstrap version).
        change:
          type: string
          description: bootstrap or login_methods_updated.
    AdminConfig:
      type: object
      required: [currentVersion, loginMethods, history]
      properties:
        currentVersion:
          type: integer
          format: int64
        loginMethods:
          $ref: "#/components/schemas/LoginMethodsState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConfigVersion"
    LoginMethodsState:
      type: object
      required: [passwordLoginEnabled, otpAutoRegister, otpChannels]
      properties:
        passwordLoginEnabled:
          type: boolean
        otpAutoRegister:
          type: boolean
        otpChannels:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ChannelState"
    ChannelState:
      type: object
      required: [enabled, priority, devOnly]
      properties:
        enabled:
          type: boolean
        priority:
          type: integer
          description: Admin-set ordering, lower first; distinct across enabled channels.
        devOnly:
          type: boolean
          description: Deployment property (D37); channel auto-disables in production runtimes.
    LoginMethodsPatch:
      type: object
      minProperties: 1
      description: Absent fields are no-ops; an all-absent body is 400 empty_patch (D70), so the schema never generates one.
      properties:
        passwordLoginEnabled:
          type: [boolean, "null"]
        otpAutoRegister:
          type: [boolean, "null"]
        otpChannels:
          type: [object, "null"]
          minProperties: 1
          description: Keys are OTP channel names (SMS, TELEGRAM, EMAIL, WHATSAPP); unknown names are 400; an empty map is 400 empty_patch (D70).
          propertyNames:
            enum: [SMS, TELEGRAM, EMAIL, WHATSAPP]
          additionalProperties:
            $ref: "#/components/schemas/ChannelPatch"
    ChannelPatch:
      type: object
      description: devOnly is intentionally absent - a deployment property, not an admin preference (D37).
      properties:
        enabled:
          type: [boolean, "null"]
        priority:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
          description: Admin-set ordering, lower first; distinct across enabled channels. Negative values are 400 invalid_priority (D70); the server parses Int32.
    FareEstimateRequest:
      type: object
      required: [pickupLat, pickupLon, dropoffLat, dropoffLon, city]
      properties:
        pickupLat:
          type: number
          minimum: -180
          maximum: 180
          description: General geo range (server accepts +/-180 on both axes; client pins latitude to +/-90).
        pickupLon:
          type: number
          minimum: -180
          maximum: 180
        dropoffLat:
          type: number
          minimum: -180
          maximum: 180
        dropoffLon:
          type: number
          minimum: -180
          maximum: 180
        city:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: Configured city key; unknown keys are 400 unknown_city (bootstrap default "monaco").
        rideType:
          type: [string, "null"]
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: 'null = estimate ALL ride types offered in the city; unknown keys are 400 unknown_ride_type.'
    FareEstimateResponse:
      type: object
      required: [city, routeSource, distanceMeters, durationSeconds, estimates, disclaimer]
      properties:
        city:
          type: string
        routeSource:
          type: string
          enum: [osrm, straight_line]
          description: straight_line = the geo stack was unreachable; the rider app may show a degraded-accuracy hint.
        distanceMeters:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        estimates:
          type: array
          items:
            $ref: "#/components/schemas/RideTypeEstimate"
        disclaimer:
          type: string
          const: estimated_price_not_final
          description: i18n KEY - the client renders the localized permanent disclaimer text.
    RideTypeEstimate:
      type: object
      required: [rideType, currency, lowTotal, highTotal, surgeMultiplier, surgeReason, breakdown]
      properties:
        rideType:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        lowTotal:
          type: number
          minimum: 0
          description: No-surge figure.
        highTotal:
          type: number
          minimum: 0
          description: Max-surge figure; equals lowTotal when no surge window is configured.
        surgeMultiplier:
          type: number
          minimum: 1
          description: The multiplier applying at the CURRENT UTC hour.
        surgeReason:
          type: [string, "null"]
          enum: [night, peak, null]
        breakdown:
          $ref: "#/components/schemas/FareBreakdown"
    FareBreakdown:
      type: object
      required: [base, distanceCost, timeCost, surgeMultiplier, minimumApplied, bookingFee, total]
      properties:
        base:
          type: number
          minimum: 0
        distanceCost:
          type: number
          minimum: 0
        timeCost:
          type: number
          minimum: 0
        surgeMultiplier:
          type: number
          minimum: 1
        minimumApplied:
          type: boolean
        bookingFee:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
          description: Money rounding is floor(x*100+0.5)/100, applied once per figure (identical math on device - P4-3 parity).
    FareConfig:
      type: object
      description: >-
        Fares section of the signed device bundle. The admin PATCH body and the device bundle
        use THE SAME nested shape (zero drift by construction); amounts are in the city's major
        currency unit.
      required: [cities, straightLine, quote]
      properties:
        cities:
          type: object
          minProperties: 1
          maxProperties: 16
          propertyNames:
            pattern: '^[a-z][a-z0-9-]{0,31}$'
          additionalProperties:
            $ref: "#/components/schemas/CityFares"
        straightLine:
          $ref: "#/components/schemas/StraightLineCalibration"
        quote:
          $ref: "#/components/schemas/QuotePolicy"
    QuotePolicy:
      type: object
      description: Final-quote policy (spec pricing) - validity window and upfront-locked vs metered-with-cap mode.
      required: [validitySeconds, mode, meteredCapMultiplier]
      properties:
        validitySeconds:
          type: integer
          minimum: 30
          maximum: 3600
        mode:
          type: string
          enum: [upfront_locked, metered_capped]
        meteredCapMultiplier:
          type: number
          minimum: 1
          maximum: 3
    CityFares:
      type: object
      required: [currency, rideTypes]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217 code.
        rideTypes:
          type: object
          minProperties: 1
          maxProperties: 16
          propertyNames:
            pattern: '^[a-z][a-z0-9-]{0,31}$'
          additionalProperties:
            $ref: "#/components/schemas/RideTypeFares"
    RideTypeFares:
      type: object
      required: [base, perKm, perMinute, minimumFare]
      properties:
        base:
          type: number
          minimum: 0
        perKm:
          type: number
          minimum: 0
        perMinute:
          type: number
          minimum: 0
        minimumFare:
          type: number
          minimum: 0
          description: Applies to base+distance+time (post-surge) BEFORE the booking fee.
        bookingFee:
          type: number
          minimum: 0
        cancelFee:
          type: number
          minimum: 0
        waitFeePerMinute:
          type: number
          minimum: 0
        night:
          $ref: "#/components/schemas/SurgeWindow"
        peak:
          $ref: "#/components/schemas/SurgeWindow"
    SurgeWindow:
      type: object
      description: Surge window in UTC hours; start==end DISABLES the window; windows may wrap midnight (22..6). Night beats peak on overlap.
      required: [multiplier, startHourUtc, endHourUtc]
      properties:
        multiplier:
          type: number
          minimum: 1
          maximum: 5
        startHourUtc:
          type: integer
          minimum: 0
          maximum: 23
          description: Integral floats (22.0) parse per JSON Schema integer semantics (ST202 lesson).
        endHourUtc:
          type: integer
          minimum: 0
          maximum: 23
    StraightLineCalibration:
      type: object
      description: Offline fallback calibration - the DEVICE computes the same straight-line estimate the server would (operator-calibrated, the device never guesses).
      required: [detourFactor, assumedAvgSpeedKmh]
      properties:
        detourFactor:
          type: number
          minimum: 1
          maximum: 3
        assumedAvgSpeedKmh:
          type: number
          exclusiveMinimum: 0
          maximum: 200
    RideCreateRequest:
      type: object
      required: [pickupLat, pickupLon, dropoffLat, dropoffLon, city, rideType]
      properties:
        pickupLat:
          type: number
          minimum: -180
          maximum: 180
        pickupLon:
          type: number
          minimum: -180
          maximum: 180
        dropoffLat:
          type: number
          minimum: -180
          maximum: 180
        dropoffLon:
          type: number
          minimum: -180
          maximum: 180
        city:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: Configured city key; unknown keys are 400 unknown_city.
        rideType:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: Ride type offered in the city; unknown keys are 400 unknown_ride_type.
        paymentMethod:
          type: string
          enum: [CASH]
          description: CASH only in Phase 4 (WALLET/POINTS land with the wallet holds, Phase 7) - other values are 400 payment_method_unavailable.
        note:
          type: [string, "null"]
          maxLength: 500
          description: Free-text note to the driver.
        pickupName:
          type: [string, "null"]
          maxLength: 200
        dropoffName:
          type: [string, "null"]
          maxLength: 200
    QuoteDto:
      type: object
      description: The server-SIGNED final quote (spec §pricing). Verify signature over "ride.quote|<payload>" with publicKeyHex (device-pinned config key).
      required: [amountMinor, currency, mode, meteredCapMinor, issuedAtEpochSec, validUntilEpochSec, payload, signature, publicKeyHex]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          description: upfront_locked = the locked total; metered_capped = the projection.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        mode:
          type: string
          enum: [upfront_locked, metered_capped]
        meteredCapMinor:
          type: integer
          minimum: 0
          description: metered_capped only - "at most this" cap (enforcement Phase 7 wallet holds).
        issuedAtEpochSec:
          type: integer
          format: int64
        validUntilEpochSec:
          type: integer
          format: int64
          description: After this, a REQUESTED ride expires on read (EXPIRED) and can no longer be accepted (Phase 5).
        payload:
          type: string
          description: The exact canonical JSON string the signature covers.
        signature:
          type: string
          minLength: 64
          description: Ed25519 hex signature.
        publicKeyHex:
          type: string
          minLength: 16
          description: Ed25519 public key (X.509 SPKI DER), hex - equals the config bundle's served publicKey.
    RideDto:
      type: object
      required: [id, status, city, rideType, paymentMethod, pickupLat, pickupLon, dropoffLat, dropoffLon, quote, cancelFeeMinor, createdAtEpochSec, updatedAtEpochSec]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED_BY_RIDER, CANCELLED_BY_DRIVER, CANCELLED_TIMEOUT, EXPIRED]
        city:
          type: string
        rideType:
          type: string
        paymentMethod:
          type: string
        note:
          type: [string, "null"]
        pickupLat:
          type: number
        pickupLon:
          type: number
        dropoffLat:
          type: number
        dropoffLon:
          type: number
        pickupName:
          type: [string, "null"]
        dropoffName:
          type: [string, "null"]
        quote:
          $ref: "#/components/schemas/QuoteDto"
        cancelFeeMinor:
          type: integer
          minimum: 0
          description: Fee recorded at cancellation (0 = none).
        createdAtEpochSec:
          type: integer
          format: int64
        updatedAtEpochSec:
          type: integer
          format: int64
    RideListDto:
      type: object
      required: [rides, limit, offset]
      properties:
        rides:
          type: array
          items:
            $ref: "#/components/schemas/RideDto"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Identifier already registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Method/channel disabled or account banned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream provider failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
