openapi: "3.1.0"
info:
  title: ride-hailing-platform API
  version: "0.1.0"
  description: >
    Tracks the IMPLEMENTED API surface only; endpoints are added as they land (B-01..). Auth endpoints return with P1-2. All writes are
    validated server-side; all admin endpoints are RBAC-gated; every state change is
    recorded in the append-only event store.
servers:
  - url: http://localhost:8080
    description: local compose stack
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/health probe
      description: Used by compose healthchecks and CI wait scripts.
      tags: [system]
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
    OtpRequest:
      type: object
      required: [channel, target]
      properties:
        channel:
          type: string
          enum: [sms, telegram, email, whatsapp]
        target:
          type: string
        locale:
          type: string
          enum: [en, fr, ar]
    OtpVerify:
      type: object
      required: [channel, target, code]
      properties:
        channel:
          type: string
          enum: [sms, telegram, email, whatsapp]
        target:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
