openapi: "3.1.0"
info:
  title: ride-hailing-platform API
  version: "0.1.0"
  contact:
    name: ride-hailing-platform maintainers
    url: https://github.com/stev199/ride-hailing-platform
  description: >
    Tracks the IMPLEMENTED API surface only; endpoints are added as they land (B-01..). Auth endpoints return with P1-2. All writes are
    validated server-side; all admin endpoints are RBAC-gated; every state change is
    recorded in the append-only event store.
servers:
  - url: http://localhost:8080
    description: local compose stack
tags:
  - name: system
    description: Liveness and health probes.
  - name: auth
    description: Registration, login (password/OTP), token lifecycle, profile, own sessions.
  - name: admin
    description: RBAC-gated admin operations (P1-3); every mutation is audited in the hash-chained event store.
  - name: config
    description: Signed config bundles (P1-5a) - public device serving + RBAC-gated admin read/patch.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/health probe
      description: Used by compose healthchecks and CI wait scripts.
      tags: [system]
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/auth/register:
    post:
      operationId: register
      description: Registers a RIDER account with a password and a unique phone and/or email. Returns the initial token pair.
      summary: Register with password and a unique phone or email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created; token pair returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/login/password:
    post:
      operationId: loginWithPassword
      description: Password login. Unknown identifier and wrong password return the same error (no user-enumeration oracle).
      summary: Password login with phone/email identifier
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      description: Generates and dispatches a 6-digit OTP (hashed at rest, 5-minute expiry, attempt- and rate-limited).
      summary: Issue a 6-digit OTP over an admin-enabled channel
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpIssued"
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      description: Verifies the OTP for an issued requestId. Logs the user in, or auto-registers a RIDER when enabled by admin config.
      summary: Verify an OTP; logs in or auto-registers (admin toggle)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Verified; token pair returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      description: Rotates the refresh token for the session family. Presenting a consumed token revokes the whole family.
      summary: Rotate the refresh token; reuse revokes the family
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refreshed"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the refresh-token family so no further refreshes are possible.
      summary: Revoke the refresh-token family
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out
        "400": { $ref: "#/components/responses/ValidationError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/me:
    get:
      operationId: getMe
      description: Returns the profile of the authenticated user (bearer access token required).
      summary: Current authenticated user profile
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/sessions:
    get:
      operationId: listMySessions
      description: Live sessions (refresh families) of the authenticated user; one entry per login (P1-3).
      summary: List own sessions
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live sessions, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/sessions/{familyId}:
    delete:
      operationId: revokeMySession
      description: Revokes one of the caller's OWN sessions by family id; a foreign or unknown id is 404 (P1-3).
      summary: Revoke one own session
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      description: Search/list users (USERS_READ). Case-insensitive substring match over phone, email and displayName.
      summary: List/search users
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateUser
      description: Creates a user with any role (USERS_WRITE). ADMIN_* roles additionally require ADMIN_SUPER (403 otherwise). Audited.
      summary: Create a user
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}:
    get:
      operationId: adminGetUser
      description: Fetch one user by id (USERS_READ).
      summary: Get a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: adminPatchUser
      description: Edit displayName/locale/status/role (USERS_WRITE). ADMIN_* role assignment and self role/status changes are 403. Audited with before/after values.
      summary: Edit a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPatchUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetPassword
      description: Sets a new password (USERS_RESET_PASSWORD) and revokes ALL of the target's sessions. The audit event never contains the password. Audited.
      summary: Reset a user's password
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResetPassword"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/admin/users/{id}/force-logout:
    post:
      operationId: adminForceLogout
      description: Revokes every live session of the target (SESSIONS_ADMIN); the response reports how many were revoked. Self force-logout is 400. Audited.
      summary: Force logout a user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceLogoutResult"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/audit:
    get:
      description: Tail of the hash-chained audit/event log (AUDIT_READ); verifyOk reports whether the whole chain recomputes.
      operationId: adminAuditTail
      summary: Read the audit tail
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: Audit tail + chain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/config:
    get:
      operationId: getConfigBundle
      description: >-
        Public signed configuration bundle (P1-5a). `config` is the EXACT canonical JSON string
        the Ed25519 `signature` covers: verify over "version|config|issuedAtEpochSec" with the
        served `publicKey`, and reject version <= the highest version already accepted
        (anti-rollback). No authentication - devices fetch the bundle pre-login; the signature
        is the trust anchor.
      summary: Current signed config bundle (public)
      tags: [config]
      responses:
        "200":
          description: Current signed bundle (version 1 is bootstrapped on first read)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundle"
  /v1/admin/config/login-methods:
    get:
      operationId: adminGetLoginMethods
      description: >-
        Current login-methods state + signed-bundle history (CONFIG_READ). OTP reads back the
        exact structures PATCH accepts; `devOnly` channels are deployment properties (D37) and
        are not patchable.
      summary: Read login methods config
      tags: [config]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current state + full version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfig"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: adminPatchLoginMethods
      description: >-
        Patch the live login methods (CONFIG_WRITE). Absent fields are no-ops; JSON null equals
        absent (D46). Every accepted patch bumps the config version, re-signs the bundle and
        appends a `config.login_methods.updated` audit event; the change affects the very next
        auth call. Validation failures answer 400 with codes empty_patch, unknown_channel,
        invalid_priority or duplicate_priority (enabled channels must keep distinct priorities).
      summary: Patch login methods (publishes a new signed version)
      tags: [config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginMethodsPatch"
      responses:
        "200":
          description: The published version entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
    OtpRequest:
      type: object
      required: [channel, target]
      properties:
        channel:
          type: string
          enum: [sms, telegram, email, whatsapp]
        target:
          type: string
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    OtpVerify:
      type: object
      required: [requestId, code]
      properties:
        requestId:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: 6-digit numeric OTP; wrong or unknown codes return 401.
        displayName:
          type: [string, "null"]
          description: >-
            Optional profile name for auto-registration. Any value is accepted;
            invalid or missing values fall back to a server default ("Rider").
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    RegisterRequest:
      type: object
      required: [displayName, password]
      anyOf:
        # At least one NON-NULL identifier (mirrors backend identifier_required,
        # D49: required alone would let explicit nulls satisfy the branch).
        - required: [phone]
          properties:
            phone:
              type: string
        - required: [email]
          properties:
            email:
              type: string
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
          description: >-
            2-64 characters with at least one non-whitespace; stored trimmed.
            All-whitespace values are rejected with 400 invalid_display_name.
        password:
          type: string
          minLength: 10
          maxLength: 128
        phone:
          type: [string, "null"]
          pattern: '^(?:[^0-9]*[0-9]){8,15}[^0-9]*$'
          description: >-
            8-15 ASCII digits; every other character (spaces, dashes,
            parentheses, a leading +) is ignored during normalization. Values
            with fewer than 8 or more than 15 digits are rejected with 400
            invalid_phone.
        email:
          type: [string, "null"]
          pattern: '^[^@]+@[^@]*[^@.]$'
          description: >-
            One '@' with a non-empty local part and a domain not ending in
            '.'. Stored trimmed and lowercased. Values without '@', with '@'
            at either end, or ending in '.' are rejected with 400
            invalid_email.
        locale:
          type: [string, "null"]
          description: >-
            Preferred UI language. Server-supported values: en, fr, ar; other
            values are accepted and stored with the server default locale.
    PasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    OtpIssued:
      type: object
      required: [requestId, expiresInSeconds, resendAfterSeconds]
      properties:
        requestId:
          type: string
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
    TokenPairDto:
      type: object
      required: [accessToken, refreshToken, accessExpiresAtEpochSec]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAtEpochSec:
          type: integer
    User:
      type: object
      required: [id, displayName, role, status, locale]
      properties:
        id:
          type: string
        phone:
          type: [string, "null"]
          pattern: '^[0-9]{8,15}$'
          description: Normalized digits-only phone (8-15 ASCII digits).
        email:
          type: [string, "null"]
        displayName:
          type: string
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        status:
          type: string
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        locale:
          type: string
    AuthSuccess:
      type: object
      required: [user, tokens, created]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPairDto"
        created:
          type: boolean
    Refreshed:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPairDto"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: [string, "null"]
    AdminUser:
      type: object
      required: [id, phone, email, displayName, role, status, locale, createdAtEpochSec]
      properties:
        id:
          type: string
        phone:
          type: [string, "null"]
          pattern: '^[0-9]{8,15}$'
          description: Normalized digits-only phone (8-15 ASCII digits); null for email-only accounts.
        email:
          type: [string, "null"]
        displayName:
          type: string
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        status:
          type: string
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        locale:
          type: string
        createdAtEpochSec:
          type: integer
    AdminUserList:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        limit:
          type: integer
        offset:
          type: integer
    AdminCreateUser:
      type: object
      required: [displayName, role]
      anyOf:
        - required: [phone]
          properties:
            phone: { type: string }
        - required: [email]
          properties:
            email: { type: string }
      description: At least one identifier (phone OR email) is required - an all-identifier-less create is 400 identifier_required.
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
        role:
          type: string
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
        phone:
          type: [string, "null"]
          pattern: '^(?:[^0-9]*[0-9]){8,15}[^0-9]*$'
          description: 8-15 ASCII digits; every other character (spaces, dashes, parentheses, a leading +) is ignored during normalization. Values with fewer than 8 or more than 15 digits are rejected with 400 invalid_phone (same shape as RegisterRequest.phone).
        email:
          type: [string, "null"]
          pattern: '^[^@]+@[^@]*[^@.]$'
          description: One '@' with a non-empty local part and a domain not ending in '.' (same shape as RegisterRequest.email); other values are rejected with 400 invalid_email.
        password:
          type: [string, "null"]
          minLength: 10
          maxLength: 128
          description: Optional initial password (policy-checked); omit for OTP-only accounts.
        locale:
          type: [string, "null"]
    AdminPatchUser:
      type: object
      properties:
        displayName:
          type: [string, "null"]
          minLength: 2
          maxLength: 64
          pattern: '[^ \t\n\u000B\f\r ]'
        locale:
          type: [string, "null"]
          enum: [en, fr, ar, null]
          description: Server-supported values en, fr, ar; other values are rejected with 400 invalid_locale.
        status:
          type: [string, "null"]
          enum: [ACTIVE, BANNED_TEMP, BANNED_PERM, DELETED]
        role:
          type: [string, "null"]
          enum: [RIDER, DRIVER, ADMIN_SUPER, ADMIN_OPS, ADMIN_SUPPORT, ADMIN_FINANCE, ADMIN_VERIFIER, ADMIN_READONLY]
    AdminResetPassword:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ForceLogoutResult:
      type: object
      required: [revokedSessions]
      properties:
        revokedSessions:
          type: integer
    Session:
      type: object
      required: [familyId, deviceId, createdAtEpochSec, lastRotatedEpochSec]
      properties:
        familyId:
          type: string
        deviceId:
          type: [string, "null"]
        createdAtEpochSec:
          type: integer
        lastRotatedEpochSec:
          type: integer
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    AuditEvent:
      type: object
      required: [seq, type, occurredAt, payloadJson, hash]
      properties:
        seq:
          type: integer
        type:
          type: string
        occurredAt:
          type: string
        payloadJson:
          type: string
          description: Canonical JSON of the event payload (keys sorted); contains no secrets.
        hash:
          type: string
    AuditTail:
      type: object
      required: [verifyOk, events]
      properties:
        verifyOk:
          type: boolean
          description: True when the whole chain recomputes (tamper check).
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    ConfigBundle:
      type: object
      required: [version, issuedAtEpochSec, config, signature, publicKey]
      properties:
        version:
          type: integer
          format: int64
          description: Monotonic config version; devices reject version <= last accepted.
        issuedAtEpochSec:
          type: integer
          format: int64
        config:
          type: string
          description: The exact canonical JSON string the signature covers (verify verbatim; do not re-serialize a parsed object).
        signature:
          type: string
          description: Ed25519 signature over "version|config|issuedAtEpochSec", hex-encoded.
        publicKey:
          type: string
          description: Ed25519 public key (X.509 SubjectPublicKeyInfo DER), hex-encoded.
    ConfigVersion:
      type: object
      required: [version, issuedAtEpochSec, config, signature, changedBy, change]
      properties:
        version:
          type: integer
          format: int64
        issuedAtEpochSec:
          type: integer
          format: int64
        config:
          type: string
        signature:
          type: string
        changedBy:
          type: string
          description: Actor id ("system" for the bootstrap version).
        change:
          type: string
          description: bootstrap or login_methods_updated.
    AdminConfig:
      type: object
      required: [currentVersion, loginMethods, history]
      properties:
        currentVersion:
          type: integer
          format: int64
        loginMethods:
          $ref: "#/components/schemas/LoginMethodsState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConfigVersion"
    LoginMethodsState:
      type: object
      required: [passwordLoginEnabled, otpAutoRegister, otpChannels]
      properties:
        passwordLoginEnabled:
          type: boolean
        otpAutoRegister:
          type: boolean
        otpChannels:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ChannelState"
    ChannelState:
      type: object
      required: [enabled, priority, devOnly]
      properties:
        enabled:
          type: boolean
        priority:
          type: integer
          description: Admin-set ordering, lower first; distinct across enabled channels.
        devOnly:
          type: boolean
          description: Deployment property (D37); channel auto-disables in production runtimes.
    LoginMethodsPatch:
      type: object
      minProperties: 1
      description: Absent fields are no-ops; an all-absent body is 400 empty_patch (D70), so the schema never generates one.
      properties:
        passwordLoginEnabled:
          type: [boolean, "null"]
        otpAutoRegister:
          type: [boolean, "null"]
        otpChannels:
          type: [object, "null"]
          minProperties: 1
          description: Keys are OTP channel names (SMS, TELEGRAM, EMAIL, WHATSAPP); unknown names are 400; an empty map is 400 empty_patch (D70).
          propertyNames:
            enum: [SMS, TELEGRAM, EMAIL, WHATSAPP]
          additionalProperties:
            $ref: "#/components/schemas/ChannelPatch"
    ChannelPatch:
      type: object
      description: devOnly is intentionally absent - a deployment property, not an admin preference (D37).
      properties:
        enabled:
          type: [boolean, "null"]
        priority:
          type: [integer, "null"]
          minimum: 0
          maximum: 2147483647
          description: Admin-set ordering, lower first; distinct across enabled channels. Negative values are 400 invalid_priority (D70); the server parses Int32.
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Identifier already registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Method/channel disabled or account banned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream provider failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
